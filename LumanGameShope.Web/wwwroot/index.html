<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Luman Game Shop</title>

    <base href="/" />

    <meta name="theme-color" content="#0B1120" />
    <meta name="description"
          content="Luman Game Shop؛ فروشگاه محصولات گیمینگ، بازی و لوازم جانبی." />

    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- فونت فارسی -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet" />

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="lib/bootstrap/dist/css/bootstrap.min.css" />

    <!-- استایل سراسری برنامه -->
    <link rel="stylesheet" href="css/app.css" />

    <!-- استایل کامپوننت‌های Blazor -->
    <link href="LumanGameShope.Web.styles.css" rel="stylesheet" />

    <!-- استایل MudBlazor -->
    <link href="_content/MudBlazor/MudBlazor.min.css"
          rel="stylesheet" />

    <script type="importmap"></script>
</head>

<body>
    <div id="app">

        <div class="d-flex flex-column align-items-center justify-content-center"
             style="min-height:100vh; background:#0B1120;">

            <svg class="loading-progress"
                 style="position:relative; inset:auto; margin:0;"
                 viewBox="0 0 100 100"
                 aria-label="در حال بارگذاری">

                <circle r="40"
                        cx="50"
                        cy="50" />

                <circle r="40"
                        cx="50"
                        cy="50" />
            </svg>

            <div class="mt-4 text-center">
                <h4 style="color:#F1F5F9; font-weight:900;">
                    LUMAN <span style="color:#60A5FA;">GAME SHOP</span>
                </h4>

                <p style="color:#94A3B8;">
                    در حال آماده‌سازی دنیای بازی...
                </p>
            </div>

        </div>

    </div>

    <div id="blazor-error-ui">
        خطایی رخ داده است.
        <a href="." class="reload">بارگذاری مجدد</a>
        <span class="dismiss">✕</span>
    </div>

    <div id="luman-initial-loader" role="status" aria-live="polite">
        <div class="luman-loader-content">
            <div class="luman-loader-logo">LUMAN</div>
            <div class="luman-loader-subtitle">GAME SHOP</div>

            <div class="luman-loader-spinner"></div>

            <div id="luman-loader-message">
                در حال آماده‌سازی فروشگاه...
            </div>

            <div class="luman-loader-progress">
                <div class="luman-loader-progress-bar"></div>
            </div>

            <div class="luman-loader-caption">
                LEVEL UP YOUR GAME
            </div>
        </div>
    </div>

    <script>
        window.lumanLoader = {
            hide: function () {
                const loader = document.getElementById(
                    "luman-initial-loader"
                );

                if (loader) {
                    loader.classList.add("luman-loader-hidden");
                }
            },

            setMessage: function (message) {
                const element = document.getElementById(
                    "luman-loader-message"
                );

                if (element) {
                    element.textContent = message;
                }
            }
        };
    </script>

    <!-- MudBlazor JavaScript -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- Blazor WebAssembly -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

</body>

</html>
